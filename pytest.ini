[pytest]
testpaths = tests
addopts = -m "not e2e and not pg_restore and not pg_migration"
markers =
    e2e: browser tests (Playwright + Google Chrome); need internet for the pdf.js CDN; run with "pytest -m e2e"
    pg_restore: restores a backup into a PostgreSQL server; needs BACKUP_RESTORE_DATABASE_URL and psql; run with "pytest -m pg_restore"
    pg_migration: applies the Alembic migrations to a PostgreSQL server; needs MIGRATION_TEST_DATABASE_URL and git; run with "pytest -m pg_migration"
